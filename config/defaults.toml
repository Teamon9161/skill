[sources.github]
url = "https://github.com/{owner}/{repo}.git"

[sources.ficc]
timeout = 1
urls = [
    "http://92.168.66.38:10112/{owner}/{repo}.git",
    "http://192.168.66.38:10112/{owner}/{repo}.git",
    "http://git.bj.swhyficc.cf:10112/{owner}/{repo}.git"
]

[agents.claude]
label = "Claude Code"
dir = ".claude"
skills = "skills"
agents = "agents"
plugin = "claude"
plugin_dir = ".claude-plugin"

[agents.codex]
label = "Codex"
dir = ".codex"
skills = "skills"

[agents.hermes]
label = "Hermes"
dir = ".hermes"
skills = "skills"

[agents.tcode]
label = "tcode"
dir = ".tcode"
skills = "skills"
agents = "agents"

[agents.cursor]
label = "Cursor"
dir = ".cursor"
skills = "skills"

[agents.pi]
label = "Pi"
dir = ".pi"
skills = "skills"

# Vendor-neutral shared location (the .agents convention). Codex reads user-wide
# skills from here; other harnesses honoring the convention pick it up too.
[agents.agents]
label = "Agents (shared)"
dir = ".agents"
skills = "skills"

# Force selected repos to use git/symlink installs even if plugin metadata exists.
# prefer_git = ["obra/superpowers"]

[aliases]
superpowers = "@obra/superpowers"
claude-hud = "@jarrodwatts/claude-hud"
ham = "@kromahlusenii-ops/ham"
lark = "@larksuite/cli"
duck-ext = "ficc@skills/duck_ext"
dolphindb = "ficc@skills/dolphindb-claude"
wiki = "ficc@skills/wiki"
pybond = "ficc@skills/pybond"

